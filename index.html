<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- O nome da aba, o nome do atalho do iPhone e a descrição abaixo são
         trocados sozinhos pelos de src/marca.js (ver vite.config.js). Não
         precisa editar aqui: edite src/marca.js. -->
    <title>FlowPlanner</title>
    <meta name="description" content="Planejamento e relatórios de obra." />

    <!-- Favicons (aba do navegador). Para usar a sua logo: npm run icones -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- iOS: atalho na tela inicial -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FlowPlanner" />

    <!-- Android / Chrome: o manifest é montado a partir de src/marca.js -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#EEF3F4" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
